<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <!-- link pour icones -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">   link pour font-family: 'Poppins' -->
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="block">
        <h2>Registration</h2>
        <form action="" method="get" id="registration-form">
            <div class="box_1">
                <i class="fa-regular fa-user"></i>
                <input type="text" class="name" id="name" placeholder="username" required>
            </div>
            <div class="box_1">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" class="email" id="email" placeholder="email" required>
            </div>
            <div class="box_1">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="pass" id="password" placeholder="password" required minlength="8">
            </div>
            <div class="box_1">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="pass" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required minlength="8">
            </div>
            <div class="box_2">
                <label for="checkbox"><input type="checkbox" id="checkbox" required>I agree to the terms & conditions</label>
            </div>
            <input type="submit" class="submit" id="register-btn" value="Register">
            <p>Already have an account ? <a role="button" href="Login.html">Login</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
