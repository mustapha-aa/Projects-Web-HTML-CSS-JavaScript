<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">   <!-- link pour icones -->

    <title>Forgot password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="block">
        <h2>Find your account</h2>
        <form action="" method="get" id="forgotPass-Form">
            <p>Please enter your email to search for your account.</p>
            <div class="box_1">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" class="email" id="email" placeholder="email" required>
            </div>
            <input type="submit" class="submit" value="Search">
            <p>Account lookup :<a role="button" href="Login.html">Cancel</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
