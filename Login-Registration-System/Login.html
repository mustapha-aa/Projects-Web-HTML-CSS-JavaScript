<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <!-- link pour icones -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">   link pour font-family: 'Poppins' -->
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="block">
        <h2>Login</h2>
        <form action="" method="get" id="login-form">
            <div class="box_1">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" class="email" id="email" placeholder="email" required>
            </div>
            <div class="box_1">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="pass" id="password" placeholder="password" required>
            </div>
            <div class="box_2">
                <label for="checkbox"><input type="checkbox" id="checkbox">Remember me</label>
                <a role="button" href="Forgot_password.html">Forgot password?</a>
            </div>
            <input type="submit" class="submit" id="login-btn" value="Log in">
            <p>Don't have a account ? <a role="button" href="Registration.html">Register</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
